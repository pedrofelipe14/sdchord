name: Build

# Every push runs the DSP tests, then in parallel builds and validates the plugin on Windows and builds
# the web version (engine compiled to WebAssembly). Pushes to main deploy the web version to GitHub
# Pages; a tag like v0.1.0 also publishes a GitHub Release with the VST3 and the Standalone app.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the DSP tests
        run: |
          cmake -S dsp -B dsp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build dsp/build --parallel
          ./dsp/build/dsp_tests

  windows:
    needs: dsp-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DSDCH_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --target SDChord_All --parallel

      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          gh release download -R Tracktion/pluginval --pattern pluginval_Windows.zip
          Expand-Archive pluginval_Windows.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --validate "build/SDChord_artefacts/Release/VST3/SDChord.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package
        shell: pwsh
        run: |
          $out = "SDChord-windows"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item -Recurse "build/SDChord_artefacts/Release/VST3/SDChord.vst3" $out
          Copy-Item "build/SDChord_artefacts/Release/Standalone/SDChord.exe" $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SDChord-windows
          path: SDChord-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SDChord-windows.zip
          generate_release_notes: true

  web:
    needs: dsp-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13

      - name: Compile the engine to WebAssembly
        run: ./scripts/build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Typecheck, tests and build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: web
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
